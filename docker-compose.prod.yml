version: "3.9"

services:
  core:
    build:
      context: ./core
      dockerfile: Dockerfile.prod
    container_name: zeni_core
    restart: always
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
    ports:
      - "8080:8080"

  bff:
    build:
      context: ./bff-django-web
      dockerfile: Dockerfile.prod
    container_name: zeni_bff
    restart: always
    depends_on:
      - core
    environment:
      CORE_URL_LOGIN: ${CORE_URL_LOGIN}
      CORE_URL_REGISTER: ${CORE_URL_REGISTER}
      CORE_URL_CREATEN8N: ${CORE_URL_CREATEN8N}
      CORE_URL_RESUME_CARDS: ${CORE_URL_RESUME_CARDS}
      CORE_URL_RESUME_CATEGORY: ${CORE_URL_RESUME_CATEGORY}
      CORE_URL_MONTH_RESUME: ${CORE_URL_MONTH_RESUME}
      CORE_URL_RESUME_INVESTMENT: ${CORE_URL_RESUME_INVESTMENT}
      CORE_URL_TABLE_RESUME: ${CORE_URL_TABLE_RESUME}
      CORE_URL_DELETE_REGISTER: ${CORE_URL_DELETE_REGISTER}
      CORE_URL_ME: ${CORE_URL_ME}
      ALLOWED_HOSTS: "localhost,127.0.0.1,bff"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./front_web
      dockerfile: Dockerfile.prod
    container_name: zeni_front
    restart: always
    depends_on:
      - bff
    ports:
      - "80:80"
