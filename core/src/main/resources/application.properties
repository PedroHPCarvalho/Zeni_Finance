spring.application.name=core

# =========================
# Datasource
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/database_test_Zeni}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dokidoki01}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA e Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================
# Flyway
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb.core=DEBUG

# =========================
# JWT e Security
# =========================
api.security.token.secret=${JWT_SECRET:key_temporaria}

# =========================
# Azure OpenAI
# =========================
azure.openai.chatgpt.key=${AZURE_OPENAI_KEY:tantofaz}
azure.openai.chatgpt.endpoint=${AZURE_OPENAI_ENDPOINT:tantofaz}
azure.openai.chatgpt.deploymentName=${AZURE_OPENAI_DEPLOYMENT:tantofaz}

# =========================
# Networking
# =========================

server.address=${SERVER_ADDRESS}
server.port=8080
